<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love you.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
  }

  body {
    font-family: 'Fira Code', monospace;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .overlay-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: 'Fira Code', monospace;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-shadow: 0 0 20px rgba(255,77,109,0.8), 0 0 40px rgba(255,77,109,0.4);
    animation: pulse 2s ease-in-out infinite;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,77,109,0.8), 0 0 40px rgba(255,77,109,0.4); }
    50% { opacity: 1; text-shadow: 0 0 30px rgba(255,77,109,1), 0 0 60px rgba(255,77,109,0.6), 0 0 80px rgba(255,77,109,0.3); }
  }

  .scanline {
    width: 100%;
    height: 100px;
    z-index: 5;
    background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0) 100%);
    position: fixed;
    animation: scanline 10s linear infinite;
    pointer-events: none;
    opacity: 0.1;
  }

  @keyframes scanline {
    0% { bottom: 100%; }
    100% { bottom: -100px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="scanline"></div>
<div class="overlay-text">Love you.</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

resizeCanvas();

window.addEventListener('resize', () => {
  resizeCanvas();
  initParticles();
});

function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
function heartY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); }

const WORD = 'i love you ';
const particles = [];
const COUNT = 350;

function initParticles() {
  particles.length = 0;
  const cx = W / 2;
  const cy = H / 2 - H * 0.05;
  const scale = Math.min(W, H) / 36;

  for (let i = 0; i < COUNT; i++) {
    const t = (Math.random() * 2 - 1) * Math.PI;
    const r = Math.random();

    const tx = cx + heartX(t) * scale * (0.5 + r * 0.5);
    const ty = cy + heartY(t) * scale * (0.5 + r * 0.5);

    const depth = Math.random();
    const fontSize = 5 + depth * 5;
    const label = Math.random() < 0.5 ? 'i love you' : 'love you';
    const alpha = 0.25 + depth * 0.75;

    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx, ty,
      label,
      fontSize,
      alpha,
      depth,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

initParticles();

let startTime = null;

function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

function draw(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(5,5,5,0.15)';
  ctx.fillRect(0, 0, W, H);

  const progress = Math.min(elapsed / 2.5, 1);
  const eased = easeInOutCubic(progress);

  for (const p of particles) {
    const px = p.x + (p.tx - p.x) * eased;
    const py = p.y + (p.ty - p.y) * eased;

    const wobbleAmt = progress > 0.95 ? Math.sin(elapsed * 2 + p.phase) * 2 : 0;

    const depth = p.depth;
    const r = Math.round(220 + depth * 35);
    const g = Math.round(30 + depth * 47);
    const b = Math.round(50 + depth * 59);

    ctx.save();
    ctx.font = `${p.fontSize}px 'Fira Code', monospace`;
    ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha * (0.6 + eased * 0.4)})`;
    ctx.fillText(p.label, px + wobbleAmt, py + wobbleAmt * 0.5);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
