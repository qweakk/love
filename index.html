<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love you.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Fira Code', monospace;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .overlay-text {
    position: absolute;
    color: white;
    font-family: 'Fira Code', monospace;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-shadow: 0 0 20px rgba(255,77,109,0.8), 0 0 40px rgba(255,77,109,0.4);
    animation: pulse 2s ease-in-out infinite;
    z-index: 10;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,77,109,0.8), 0 0 40px rgba(255,77,109,0.4); }
    50% { opacity: 1; text-shadow: 0 0 30px rgba(255,77,109,1), 0 0 60px rgba(255,77,109,0.6), 0 0 80px rgba(255,77,109,0.3); }
  }

  .scanline {
    width: 100%;
    height: 100px;
    z-index: 5;
    background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0) 100%);
    position: absolute;
    animation: scanline 10s linear infinite;
    pointer-events: none;
    opacity: 0.1;
  }

  @keyframes scanline {
    0% { bottom: 100%; }
    100% { bottom: -100px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="scanline"></div>
<div class="overlay-text">Love you.</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initParticles();
});

// Heart shape function
function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
function heartY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); }

const WORD = 'i love you ';
const particles = [];
const COUNT = 350;

function initParticles() {
  particles.length = 0;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = Math.min(canvas.width, canvas.height) / 38;

  for (let i = 0; i < COUNT; i++) {
    const t = (Math.random() * 2 - 1) * Math.PI;
    const r = Math.random();

    // target on heart perimeter / fill
    const tx = cx + heartX(t) * scale * (0.5 + r * 0.5);
    const ty = cy + heartY(t) * scale * (0.5 + r * 0.5);

    const depth = Math.random();
    const fontSize = 7 + depth * 7;
    const char = WORD[i % WORD.length];
    const label = char === ' ' ? '\u00A0' : (Math.random() < 0.15 ? WORD.slice(i % WORD.length, i % WORD.length + 7).trim() || 'i love you' : (Math.random() < 0.5 ? 'i love you' : 'love you'));

    const alpha = 0.25 + depth * 0.75;

    // start from random position
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      tx, ty,
      label,
      fontSize,
      alpha,
      depth,
      speed: 0.008 + Math.random() * 0.015,
      phase: Math.random() * Math.PI * 2,
      wobble: (Math.random() - 0.5) * 0.3,
    });
  }
}

initParticles();

let startTime = null;

function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

function draw(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Subtle dark background
  ctx.fillStyle = 'rgba(5,5,5,0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const progress = Math.min(elapsed / 2.5, 1);
  const eased = easeInOutCubic(progress);

  for (const p of particles) {
    const px = p.x + (p.tx - p.x) * eased;
    const py = p.y + (p.ty - p.y) * eased;

    // heartbeat wobble after arrival
    const wobbleAmt = progress > 0.95 ? Math.sin(elapsed * 2 + p.phase) * 2 : 0;

    const depth = p.depth;
    const r = Math.round(220 + depth * 35);
    const g = Math.round(30 + depth * 47);
    const b = Math.round(50 + depth * 59);

    ctx.save();
    ctx.font = `${p.fontSize}px 'Fira Code', monospace`;
    ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha * (0.6 + eased * 0.4)})`;
    ctx.fillText(p.label, px + wobbleAmt, py + wobbleAmt * 0.5);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
